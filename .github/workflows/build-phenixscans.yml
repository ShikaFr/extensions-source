name: Build PhenixScans APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build PhenixScans
        run: ./gradlew :extensions:individual:fr:phenixscans:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: phenixscans-apk
          path: src/fr/phenixscans/build/outputs/apk/debug/*.apk
